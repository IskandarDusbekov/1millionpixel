services:
  redis:
    image: redis:7-alpine
    # appendonly — server o'chsa kanvas yo'qolmasin (1 MB, tez tiklanadi)
    command: >
      redis-server --appendonly yes --appendfsync everysec --save ""
      --maxmemory 256mb --maxmemory-policy noeviction
    volumes: [redis-data:/data]
    # Port ATAYLAB e'lon qilinmagan. Konteynerlar o'zaro ichki tarmoq
    # orqali gaplashadi, host'ga chiqarish shart emas. Shunda:
    #   - serverda allaqachon Redis bo'lsa, 6379 to'qnashmaydi;
    #   - parolsiz Redis tasodifan internetga ochilib qolmaydi.
    # Debug uchun kerak bo'lsa:  docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-millionpixel}
      POSTGRES_USER: ${POSTGRES_USER:-mp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp}
    # 4 GB serverga moslangan
    command: >
      postgres -c shared_buffers=256MB -c work_mem=8MB
               -c max_connections=50 -c effective_cache_size=1GB
    volumes: [pg-data:/var/lib/postgresql/data]
    # Port e'lon qilinmagan — serverdagi mavjud PostgreSQL (5432) bilan
    # to'qnashmasligi uchun. Kerak bo'lsa:
    #   docker compose exec postgres psql -U mp millionpixel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mp}"]
      interval: 5s
    restart: unless-stopped

  web:
    build: .
    # Har bir worker o'z socketlarini o'zi boshqaradi (pub/sub fan-out).
    # CPU yadrosiga 1 ta worker: 2 yadro -> 2 worker.
    command: >
      uvicorn config.asgi:application
      --host 0.0.0.0 --port 8000 --workers ${WEB_WORKERS:-2}
      --ws-ping-interval 20 --proxy-headers --forwarded-allow-ips '*'
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
    volumes:
      - ./media:/app/media
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    # Faqat lokal: oldida nginx turadi. 8000 band bo'lsa .env da
    # WEB_PORT=8010 qiling va nginx'da ham shu portni ko'rsating.
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    restart: unless-stopped

  history:
    build: .
    command: python manage.py drain_history
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # Timelapse — doska suratlari. Alohida protsess, chunki PNG qilish
  # CPU oladi va WebSocket'ni bloklamasligi kerak.
  timelapse:
    build: .
    command: python manage.py timelapse_worker
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
    volumes:
      # Bind mount (nomli volume emas): host'dagi nginx suratlarni
      # to'g'ridan-to'g'ri uzata olishi uchun.
      - ./media:/app/media
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
