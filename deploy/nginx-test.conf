# Million Piksel — SINOV rejimi: domen va sertifikatsiz.
#
# 8080-portda ishlaydi, ya'ni 80/443 ga UMUMAN tegmaydi — mavjud
# saytlaringiz uchun xavf nolga teng. Manzil: http://SERVER_IP:8080
#
# O'rnatish:
#   sudo cp deploy/nginx-test.conf /etc/nginx/sites-available/millionpixel-test
#   sudo ln -s /etc/nginx/sites-available/millionpixel-test /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domen va sertifikat tayyor bo'lgach bu faylni o'chirib, nginx-host.conf
# ga o'ting:
#   sudo rm /etc/nginx/sites-enabled/millionpixel-test
#
# DIQQAT: bu rejimda HTTPS yo'q. Telegram Mini App ham, Google orqali
# kirish ham ISHLAMAYDI (ikkalasi ham haqiqiy https talab qiladi).
# Sinash uchun .env da vaqtincha DEV_LOGIN=1 qiling va pastdagi
# "allow" qatoriga o'z IP manzilingizni yozing.

map $http_upgrade $connection_upgrade_mp_test {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # --- KIRISHNI CHEKLASH ---
    # DEV_LOGIN=1 bo'lganda sayt ochiq qolsa, har kim hisob ochib
    # energiya limitini chetlab o'tadi. Shuning uchun faqat o'zingizga
    # ruxsat bering. O'z IP ingizni bilish uchun: curl -s ifconfig.me
    # Hammaga ochish kerak bo'lsa, shu uch qatorni izohga oling (#).
    allow 213.230.78.242;   # <<< O'Z IP MANZILINGIZ
    allow 127.0.0.1;
    deny  all;

    client_max_body_size 1m;

    access_log /var/log/nginx/millionpixel-test.access.log;
    error_log  /var/log/nginx/millionpixel-test.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/octet-stream;

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_mp_test;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /media/ {
        alias /opt/millionpixel/media/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
