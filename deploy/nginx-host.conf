# Million Piksel — SERVERDA ALLAQACHON NGINX BOR bo'lgan holat uchun.
#
# Docker'dagi nginx konteyneri ishlatilmaydi (80/443 band). Bu fayl
# host'dagi nginx'ga qo'shiladi va so'rovlarni 127.0.0.1:8000 ga uzatadi.
#
# O'rnatish:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/millionpixel
#   sudo ln -s /etc/nginx/sites-available/millionpixel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keyin sertifikat:
#   sudo certbot --nginx -d piksel.SIZNING-DOMEN.uz
# (certbot bu faylga 443 blokini o'zi qo'shadi)

# WebSocket uchun Upgrade sarlavhasi. Agar boshqa saytingizda ham shu
# map bo'lsa, ikkinchi marta e'lon qilmang — nginx xato beradi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Bitta IP dan ko'pi bilan 10 ta bir vaqtli ulanish
limit_conn_zone $binary_remote_addr zone=mp_perip:10m;
# Avtorizatsiyaga sekundiga 5 ta so'rov
limit_req_zone  $binary_remote_addr zone=mp_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;

    # >>> O'Z DOMENINGIZNI YOZING <<<
    server_name piksel.SIZNING-DOMEN.uz;

    # Loyiha papkasi (media shu yerda)
    set $mp_root /opt/millionpixel;

    client_max_body_size 1m;
    limit_conn mp_perip 10;

    access_log /var/log/nginx/millionpixel.access.log;
    error_log  /var/log/nginx/millionpixel.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/octet-stream;

    # --- WebSocket: real-time piksellar ---
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # jim turgan ulanish uzilmasin
        proxy_send_timeout 3600s;
        proxy_buffering off;        # real-time uchun buferlash o'chirilgan
    }

    # --- Kanvas snapshot: 1 MB -> ~35 KB ---
    location = /api/canvas.bin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django allaqachon gzip qilib yuboradi (keshlangan), qayta siqilmaydi
    }

    # --- Avtorizatsiya: qo'shimcha limit ---
    location ~ ^/api/auth/ {
        limit_req zone=mp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin panelga fayl yuklash: 5 MB gacha (boshqa joyda 1 MB) ---
    location = /admin/panel/api/files/upload {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Timelapse suratlari va yuklangan fayllar: to'g'ridan-to'g'ri diskdan ---
    location /media/ {
        alias /opt/millionpixel/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Qolgan hammasi (/static/ ni whitenoise uzatadi) ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
