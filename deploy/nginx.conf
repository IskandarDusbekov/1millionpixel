# Million Piksel — nginx.
#
# Uchta narsa hayotiy muhim:
#   1. /api/canvas.bin uchun gzip — 1 MB o'rniga ~50 KB uzatiladi.
#   2. WebSocket uchun Upgrade sarlavhalari va uzun timeout.
#   3. IP bo'yicha ulanish limiti (WebSocket'dagi token bucket'ga qo'shimcha).

upstream mp_app {
    server web:8000;
    keepalive 64;
}

# Bitta IP dan ko'pi bilan 10 ta bir vaqtli ulanish
limit_conn_zone $binary_remote_addr zone=perip:10m;
# Auth endpointiga sekundiga 5 ta so'rov
limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name millionpixel.uz www.millionpixel.uz;

    # Let's Encrypt tekshiruvi
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name millionpixel.uz www.millionpixel.uz;

    ssl_certificate     /etc/letsencrypt/live/millionpixel.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/millionpixel.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Telegram Mini App iframe ichida ochiladi
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    limit_conn perip 10;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/octet-stream;

    # --- kanvas snapshot: 1 MB -> ~50 KB ---
    location = /api/canvas.bin {
        proxy_pass http://mp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types application/octet-stream;
        proxy_buffering on;
    }

    # --- WebSocket ---
    location /ws/ {
        proxy_pass http://mp_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;   # jim turgan ulanish uzilmasin
        proxy_send_timeout  3600s;
        proxy_buffering off;         # real-time uchun buferlash o'chirilgan
    }

    # --- avtorizatsiya: qo'shimcha limit ---
    location ~ ^/api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://mp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Timelapse suratlari — o'zgarmaydi, uzoq keshlash mumkin
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://mp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
